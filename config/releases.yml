# Repos whose GitHub releases are posted into the forum (edit by PR).
# Forum layout: a parent category (default "Project Releases") > one subcategory per entry > ONE pinned,
# closed topic "<repo> releases"; the bot posts each new release as a reply.
# Fill category_id/topic_id by running `python -m hhf.release_feed --bootstrap` (it prints them).
# Optional per-entry fields:
#   parent: parent category name (default "Project Releases"); created by bootstrap if missing.
#   name: subcategory display name (default: the repo basename).
#   tag_prefix: only releases whose tag starts with this are posted. Use it to split one repo into several
#     entries (e.g. ios-/mac-) or to ignore moving tags; a split topic is "<repo> <name> releases".
#     Entries sharing a repo need distinct tag_prefix values; state is keyed by "<repo>#<tag_prefix>".
# groups: public self-join groups (1-20 chars of a-z0-9_-), e.g. releases-traefik. Joining one sets the
# subcategory to Watching and the release workflow DMs the group on every release. Bootstrap creates missing groups.
releases:
- repo: fosrl/pangolin
  parent: Pangolin Releases
  name: Pangolin
  category_id: 116
  topic_id: 4810
  groups: [releases-pangolin]
  include_prereleases: false

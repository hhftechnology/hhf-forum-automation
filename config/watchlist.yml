# Watchlist of popular self-hosted projects for the weekly advisory.
# repo      -> GitHub owner/repo (GHSA source_code_location match, releases, repo advisories)
# image     -> container image used in the generated upgrade command (optional)
# packages  -> GHSA ecosystem + package name (ecosystem names as used by GitHub: go, npm, pip, ...)
# nvd       -> CPE vendors and description keywords (case-insensitive, word boundary)
# category  -> edge | identity | platform | app | data (edge items are listed first in the intro)
# kev       -> CISA KEV vendorProject/product aliases; a KEV entry is attributed to this project only on a match
# group     -> optional; projects sharing a group are merged into one numbered item (e.g. Incus & LXD)
projects:
- name: Traefik
  kev:
  - {vendor: "Traefik Labs", product: "Traefik"}
  category: edge
  repo: traefik/traefik
  image: traefik
  packages:
  - ecosystem: go
    name: github.com/traefik/traefik/v3
  - ecosystem: go
    name: github.com/traefik/traefik/v2
  nvd:
    vendors:
    - traefik
    - traefik_labs
    keywords:
    - traefik

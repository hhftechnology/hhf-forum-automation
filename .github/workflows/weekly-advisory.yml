name: Weekly advisory

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: write out/*.md, upload it as an artifact, post nothing"
        type: boolean
        default: true
      since:
        description: "Window start (YYYY-MM-DD). Empty = 7 days before today"
        type: string
        default: ""

permissions:
  contents: write # commit state/posted.json
  models: read # GitHub Models (first-choice free LLM; falls back to Gemini, then to deterministic text)

concurrency:
  group: weekly-advisory
  cancel-in-progress: false

jobs:
  advisory:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
      SINCE: ${{ inputs.since }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DISCOURSE_URL: ${{ secrets.DISCOURSE_URL }}
      DISCOURSE_API_KEY: ${{ secrets.DISCOURSE_API_KEY }}
      WORKFLOW_WEBHOOK_TOKEN: ${{ secrets.WORKFLOW_WEBHOOK_TOKEN }}
      WORKFLOW_WEBHOOK_URL_WEEKLY: ${{ secrets.WORKFLOW_WEBHOOK_URL_WEEKLY }}
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }} # optional
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} # optional
      ADVISORY_DRAFTS_CATEGORY_ID: ${{ vars.ADVISORY_DRAFTS_CATEGORY_ID }} # only for --direct
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Cache source responses
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .cache
          key: weekly-cache-${{ github.run_id }}
          restore-keys: weekly-cache-
      - name: Build and deliver the weekly advisory
        run: |
          args=()
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ -n "$SINCE" ]; then args+=(--since "$SINCE"); fi
          python -m hhf.weekly "${args[@]}"
      - name: Upload dry-run output
        if: ${{ always() && env.DRY_RUN == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: weekly-advisory-out
          path: out/
          if-no-files-found: warn
      - name: Commit posted ids
        if: ${{ env.DRY_RUN != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/posted.json
          if git diff --cached --quiet; then echo "no state change"; exit 0; fi
          git commit -m "chore: record posted advisories [skip ci]"
          git pull --rebase --autostash
          git push

name: form-sync

on:
  push:
    paths: ["forms/**", "src/hhf/form_sync.py", "tests/test_form_sync.py", ".github/workflows/form-sync.yml"]
  pull_request:
    paths: ["forms/**", "src/hhf/form_sync.py", "tests/test_form_sync.py", ".github/workflows/form-sync.yml"]
  workflow_dispatch:
    inputs:
      apply:
        description: Save the YAML to the forum as DRAFTS (default false = diff only). Publishing stays manual.
        type: boolean
        default: false
      allow_removed:
        description: Allow dropping field names that exist live (update W16 code nodes first)
        type: boolean
        default: false

concurrency:
  group: form-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: python -m hhf.form_sync --validate-only
      - run: python -m pytest -q tests/test_form_sync.py

  # Runs only on a manual dispatch. The environment must be configured (Settings > Environments >
  # forum-production) with required reviewers; the secrets live there.
  sync:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: forum-production
    env:
      DISCOURSE_URL: ${{ secrets.DISCOURSE_URL }}
      DISCOURSE_API_KEY: ${{ secrets.DISCOURSE_API_KEY }}
      DISCOURSE_API_USERNAME: system
      APPLY: ${{ inputs.apply }}
      ALLOW_REMOVED: ${{ inputs.allow_removed }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .
      - name: Diff against the live forum
        run: python -m hhf.form_sync
      - name: Save drafts
        if: ${{ inputs.apply }}
        env:
          FORM_SYNC_CONFIRM: "yes"
        run: |
          args=(--apply)
          if [ "$ALLOW_REMOVED" = "true" ]; then args+=(--allow-removed); fi
          python -m hhf.form_sync "${args[@]}"

name: Daily briefing

on:
  schedule:
    - cron: "30 5 * * *" # every day 05:30 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: write out/*.md, upload it as an artifact, post nothing"
        type: boolean
        default: true

permissions:
  contents: write
  models: read # GitHub Models (first-choice free LLM; falls back to Gemini, then to deterministic text)

concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DISCOURSE_URL: ${{ secrets.DISCOURSE_URL }}
      DISCOURSE_API_KEY: ${{ secrets.DISCOURSE_API_KEY }}
      WORKFLOW_WEBHOOK_TOKEN: ${{ secrets.WORKFLOW_WEBHOOK_TOKEN }}
      WORKFLOW_WEBHOOK_URL_DAILY: ${{ secrets.WORKFLOW_WEBHOOK_URL_DAILY }}
      ABUSECH_AUTH_KEY: ${{ secrets.ABUSECH_AUTH_KEY }} # optional
      OTX_KEY: ${{ secrets.OTX_KEY }} # optional
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }} # optional
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} # optional
      BRIEFING_DRAFTS_CATEGORY_ID: ${{ vars.BRIEFING_DRAFTS_CATEGORY_ID }} # only for --direct
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Build and deliver the daily briefing
        run: |
          args=()
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python -m hhf.daily "${args[@]}"
      - name: Upload dry-run output
        if: ${{ always() && env.DRY_RUN == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: daily-briefing-out
          path: out/
          if-no-files-found: warn

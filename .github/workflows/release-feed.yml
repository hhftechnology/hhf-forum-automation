name: Release feed

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: print planned posts, post nothing, write no state"
        type: boolean
        default: true

permissions:
  contents: write # commit state/releases.json

concurrency:
  group: release-feed
  cancel-in-progress: false

jobs:
  releases:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DISCOURSE_URL: ${{ secrets.DISCOURSE_URL }}
      DISCOURSE_API_KEY: ${{ secrets.DISCOURSE_API_KEY }}
      WORKFLOW_WEBHOOK_URL_RELEASE: ${{ secrets.WORKFLOW_WEBHOOK_URL_RELEASE }}
      WORKFLOW_WEBHOOK_TOKEN: ${{ secrets.WORKFLOW_WEBHOOK_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Post new releases
        run: |
          args=()
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python -m hhf.release_feed "${args[@]}"
      - name: Commit posted releases
        if: ${{ env.DRY_RUN != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/releases.json
          if git diff --cached --quiet; then echo "no state change"; exit 0; fi
          git commit -m "chore: record posted releases [skip ci]"
          git pull --rebase --autostash
          git push

name: Release feed

on:
  push:
    branches: [main]
    paths:
      - "config/releases.yml"
  pull_request:
    paths:
      - ".github/workflows/release-feed.yml"
      - "config/releases.yml"
      - "src/hhf/discourse.py"
      - "src/hhf/release_feed.py"
      - "scripts/build_workflow_json.py"
      - "tests/**"
      - "docs/workflows/4-release-notify.json"
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: print planned posts, post nothing, write no state"
        type: boolean
        default: true
      bootstrap:
        description: "Bootstrap: provision any missing release channels and print their ids"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('release-feed-pr-{0}', github.event.pull_request.number) || 'release-feed' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Validate release configuration
        run: python -m hhf.release_feed --validate-only
      - run: pytest -q

  releases:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # commit release and channel state
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
      BOOTSTRAP: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap || 'false' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DISCOURSE_URL: ${{ secrets.DISCOURSE_URL }}
      DISCOURSE_API_KEY: ${{ secrets.DISCOURSE_API_KEY }}
      WORKFLOW_WEBHOOK_URL_RELEASE: ${{ secrets.WORKFLOW_WEBHOOK_URL_RELEASE }}
      WORKFLOW_WEBHOOK_TOKEN: ${{ secrets.WORKFLOW_WEBHOOK_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Post new releases
        run: |
          args=()
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ "$BOOTSTRAP" = "true" ]; then args+=(--bootstrap); fi
          python -m hhf.release_feed "${args[@]}"
      - name: Commit release state and channel mapping
        if: ${{ !cancelled() && env.DRY_RUN != 'true' }} # also after a failed post, so successful posts and provisioning are kept
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/releases.json
          git add state/release_channels.json
          if git diff --cached --quiet; then echo "no state change"; exit 0; fi
          git commit -m "chore: record release feed state [skip ci]"
          git pull --rebase --autostash
          git push

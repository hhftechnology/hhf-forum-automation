[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hhf"
version = "0.1.0"
description = "Automation for the HHF forum: weekly advisories, daily briefings, docs sync"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6",
  "jinja2>=3.1",
  "feedparser>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/hhf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hhf"
version = "0.1.0"
description = "Docs sync and form sync for forum.hhf.technology"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/hhf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
